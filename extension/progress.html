<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; }
    body {
      width: 100%; margin: 0; padding: 18px;
      background: #0F1117; color: #F0F1F3;
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, sans-serif;
    }
    h1 { font-size: 16px; margin: 0 0 2px; font-weight: 800; }
    .sub { color: #6B6F78; font-size: 11px; margin-bottom: 16px; }

    .counter { font-size: 13px; font-weight: 700; margin-bottom: 8px; }
    .counter .big { font-size: 22px; }

    .bar-wrap { width: 100%; height: 10px; background: #1A1D23; border-radius: 6px; overflow: hidden; margin-bottom: 6px; }
    .bar-fill { height: 100%; width: 0%; border-radius: 6px;
      background: linear-gradient(90deg, #00D4FF, #7B2FFF); transition: width 0.4s ease; }
    .bar-meta { display: flex; justify-content: space-between; font-size: 11px; color: #8B8F98; margin-bottom: 14px; }
    .bar-meta .pass { color: #4ADE80; }
    .bar-meta .skip { color: #00D4FF; }
    .bar-meta .fail { color: #F87171; }

    .list { background: #15181F; border: 1px solid #23262E; border-radius: 10px;
      max-height: 300px; overflow-y: auto; padding: 6px; }
    .row { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 7px; font-size: 12px; }
    .row + .row { border-top: 1px solid #1E212A; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
    .dot.ok { background: #4ADE80; }
    .dot.no { background: #F87171; }
    .dot.run { background: #FBBF24; }
    .dot.skip { background: #00D4FF; }
    .tk { font-weight: 700; color: #C9CCD2; }
    .meta { margin-left: auto; font-weight: 700; }
    .meta.ok { color: #4ADE80; }
    .meta.no { color: #F87171; font-weight: 600; font-size: 11px; max-width: 180px; text-align: right;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta.run { color: #FBBF24; }
    .meta.skip { color: #00D4FF; font-weight: 600; }

    .empty { color: #6B6F78; font-size: 12px; text-align: center; padding: 18px 0; }

    .done-banner { display: none; margin-top: 14px; padding: 12px; border-radius: 10px;
      font-size: 13px; font-weight: 700; text-align: center;
      background: #4ADE8012; border: 1px solid #4ADE8033; color: #4ADE80; }
    .done-banner.show { display: block; }

    .btn { width: 100%; margin-top: 14px; padding: 12px; border-radius: 8px; border: none;
      font-size: 13px; font-weight: 700; cursor: pointer;
      background: #1A1D23; color: #C9CCD2; border: 1px solid #2A2D35; }
    .btn:hover { border-color: #7B2FFF55; color: #FFF; }
  </style>
</head>
<body>
  <h1>🔧 Batch Grading</h1>
  <div class="sub">Focused Technologies — Ticket Grader</div>

  <div id="modeLine" style="font-size:11px;font-weight:700;margin-bottom:8px;display:none;"></div>
  <div class="counter" id="counter">Starting…</div>
  <div class="bar-wrap"><div class="bar-fill" id="barFill"></div></div>
  <div class="bar-meta">
    <span id="pctLabel">0%</span>
    <span>
      <span class="pass" id="passCount">0</span> graded ·
      <span class="skip" id="skipCount">0</span> skipped ·
      <span class="fail" id="failCount">0</span> failed
    </span>
  </div>

  <div class="list" id="list">
    <div class="empty" id="emptyMsg">Waiting for the first ticket…</div>
  </div>

  <div class="done-banner" id="doneBanner"></div>

  <button class="btn" id="closeBtn">Close window</button>

  <script src="progress.js"></script>
</body>
</html>
